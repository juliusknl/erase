name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q -m "not visual"

      - name: Check release payload
        run: uv run python scripts/release_check.py

  visual:
    name: Responsive rendering
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Render desktop and mobile views
        run: uv run pytest -q -m visual

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag personal-erasure:ci .

      - name: Validate Compose configuration
        env:
          ERASURE_MASTER_KEY: ci-placeholder
          ERASURE_PASSWORD_HASH: ci-placeholder
          ERASURE_SESSION_SECRET: ci-placeholder
        run: |
          cp .env.example .env
          docker compose config --quiet
