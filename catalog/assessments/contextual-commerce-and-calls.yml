  - record: community:marchex
    disposition: out_of_scope
    checked_on: '2026-10-01'
    rationale: Excluded from default independent-broker email outreach, not declared data-free. Marchex Inc's current notice describes call recordings, transcripts, caller IDs and linked online activity processed for clients; access/correction/deletion should go to the client controller. Direct-site records and eligible US requests have privacy@marchex.com and the published access form, but do not establish a universal European consumer database removal. Identify the actual business called before a targeted request.
    evidence:
      - url: https://www.marchex.com/privacy-policy/
        checked_on: '2026-10-01'
        published: '2026-09-10'
        excerpt: should direct their query to the Client, the data controller
        supports: [identity, recorded_call_processing, client_routing, separate_direct_rights]
    unresolved: []
  - record: community:narrativ
    disposition: out_of_scope
