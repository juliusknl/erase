    rationale: This discovery record already names Howl Technologies Inc despite its legacy Narrativ slug. The current Howl notice describes creator/merchant platform users and excludes merchant-controlled processing, directing those requests to the merchant. Excluded from default independent-broker outreach, not from user-selected privacy action. Direct-user advertising and lookalike processing exist, and European users can contact privacy@howl.link; account closure and merchant records require relationship-specific review, not a blanket request to an unrelated similarly named Narrativ company.
