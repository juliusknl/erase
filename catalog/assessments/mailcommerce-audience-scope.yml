        supports: [ambiguous_advertiser_list, website_notice, rights_contact]
      - url: https://www.mailcommerce.de/de/index.html
        checked_on: '2026-10-01'
        excerpt: Onlinemarketing-Agenturen mit dem Fokus auf Neukundengenerierung
        supports: [agency_service_scope]
