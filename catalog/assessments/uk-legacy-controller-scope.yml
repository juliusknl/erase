    rationale: This row names KSV1870 Holding AG, the group website operator and processor, not the independent credit/address-trading controller. The official notice assigns that product to KSV1870 Information GmbH, already covered by the separate ksv1870-at guide. Exclude a redundant default holding-company broker request; direct website, recruitment or survey rights remain available and this is not a no-data finding.
