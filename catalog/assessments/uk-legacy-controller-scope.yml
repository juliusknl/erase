    guide_id: transunion-uk
    checked_on: '2026-10-01'
    rationale: Companies House confirms Callcredit Information Group Limited became TransUnion Information Group Limited in 2019 under the same company number. Use the existing UK product-specific rights guide, not TransUnion US state-law forms; marketing suppression remains distinct from credit-file erasure.
