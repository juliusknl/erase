    coverage:
      effect: suppression
      includes: Selected Experian UK marketing processing and profiling; the broad option removes marketing data and insights while retaining minimal suppression details.
      excludes: Credit-reference records, account communications and other companies' marketing are separate.
    automation:
      mode: manual
      reason: UK address matching and the requester's own IP context require a personal form handoff; credit-record rights remain separate.
