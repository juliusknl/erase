    request: Please erase my matched personal professional and business-contact data controlled by CB Insights, including data obtained from external sources, and stop using my personal information for direct marketing. Please search using the professional identifiers below. This is not merely a newsletter unsubscribe or a request to delete an entire company profile. Please identify any further verification needed and explain any retained personal data.
