    effect: deletion_request
    request: Please delete my matching personal records from Melissa Lookups and the consumer database products you control. I object to use or supply of my personal information for marketing. This concerns database records, not merely unsubscribing from Melissa's own advertising. Please explain any further matching requirements and any retained data.
    why: Melissa database products connect names and addresses with contact and consumer attributes.
