    destination: datenschutz@addconti.ch
    countries: [DE]
    fields: [full_name, email, other_emails]
    requires_matching_email: true
    effect: deletion_request
    request: Please erase my matched personal records controlled by Add Conti GmbH and stop using or disclosing my data for direct marketing. If you rely on marketing consent attributed to me, I withdraw it. This is not an assertion that I entered any sweepstakes. Please identify which records you matched, explain any required retention and identify independent recipients needing a separate request.
