  - guide_id: costar-professional-property
    destination: support@costar.com
    countries: [EEA]
    fields: [full_name, email, other_emails, work_email, employer]
    requires_matching_email: true
    effect: deletion_request
    request: Please erase my matched personal professional and property-contact records in CoStar's information services where you act as controller, and stop using or disclosing those records for direct marketing. This is not a request to close a customer account or remove an entire property or company listing. Please use the identifying details below and explain any additional matching or identity verification needed. Please identify any retained personal data and any separate product controller I should contact; I do not assume this request covers all CoStar Group brands or independent recipients.
    why: CoStar professional property information can link named people to business contacts and property relationships.
    follow_up: Initial CoStar-product email only. Further address, phone, identity checks and brand-specific referrals remain manual.
    evidence:
      - url: https://www.costar.com/en-gb/gbr/about/privacy-notice
        checked_on: '2026-10-01'
        published: '2026-08-10'
        excerpt: 'Email: Support@costar.com'
        supports: [official_rights_email, European_rights, product_specific_scope]
  - guide_id: sovrn-advertising
    destination: privacy@sovrn.com
    countries: [EEA]
    fields: [full_name, email, other_emails]
    requires_matching_email: true
    effect: deletion_request
    request: Please erase personal advertising and data-service records linked to the email identifiers below, including their hashed forms, where you act as controller, and stop their use or disclosure for direct marketing and targeted advertising. This concerns reader data, not closure of any publisher account. Please explain any additional matching or verification needed and identify the appropriate publisher controller where you process data only on its instructions. I do not assume this email identifies all of my cookies or devices.
    why: Sovrn Signal and Data services use hashed email for cross-device matching and distribute audience data.
    follow_up: Initial email-linked request only. Technical identifiers, further verification and publisher referrals remain manual; no home address or identity document is sent.
    evidence:
      - url: https://www.sovrn.com/privacy-policy/privacy-policy/
        checked_on: '2026-10-01'
        published: '2026-01-14'
        excerpt: For EEA/UK/Switzerland residents
        supports: [European_email_rights, email_hash_identifiers, controller_processor_limits]
  - guide_id: burda-direkt-marketing
    destination: burdadirektservices@datenschutzanfrage.de
    countries: [EEA]
    fields: [full_name, email, other_emails, postal_address]
    effect: suppression
    request: I object to the processing and disclosure of my personal data for direct marketing and related profiling, and withdraw any marketing or contact-enrichment consent attributed to me. Please suppress my matched records from those uses, including enrichment of telephone contact details. I do not assert that I entered a competition. Do not cancel any paid subscriptions or unrelated services. Please identify the controllers and datasets covered and explain any limited consent-evidence or suppression retention and any separate sponsor requests required.
    why: The current Burda Direkt notice describes sponsor marketing, shared subscription marketing and telephone enrichment from external sources.
