schema_version: 1
associations:
  - guide_id: alikeaudience-route-review
    records: [community:alikeaudience]
    rationale: AlikeAudience Inc is the exact company named by the community entry and reviewed policy. The missing operational contact/form and contradictory identifier scope remain unresolved, not upgraded through association.
  - guide_id: wunderkind
    records: [community:bouncex]
    rationale: Despite its legacy slug, the imported record explicitly names Wunderkind Corporation and its current domain, matching the reviewed controller. Missing affidavit content and customer-controlled data limitations remain explicit.
  - guide_id: groundtruth
    records: [community:groundtruth]
    rationale: The community's xAd Inc is the legal company explicitly trading as GroundTruth in the current policy. US rights instructions do not establish European eligibility or automatic device matching.
  - guide_id: taboola
    records: [community:taboola]
    rationale: Taboola Inc is explicitly named among the shared notice's affiliates. The guide retains Taboola.com Ltd as EEA/UK controller and excludes separately governed Connexity/Skimlinks rather than treating every affiliate as one deletion.
  - guide_id: valassis
    records: [community:valassisdigital]
    rationale: Valassis Digital Corp is expressly included by the dedicated Valassis notice under RRD. Other RRD businesses and the separately managed Save Mailer are not silently merged into deletion coverage.
  - guide_id: venntel
    records: [community:venntel]
    rationale: Venntel Inc matches the current data-services notice and domain; sensitive location matching and security-retention exceptions remain manual, with no implied Unacast group coverage.
  - guide_id: yieldmo
    records: [community:yieldmo]
    rationale: Yieldmo Inc is the identical company in the community record and current advertising-services policy. Device-specific identifiers and customer-controller distinctions remain unchanged.
  - guide_id: cerved-italy
    records: [discovery:ancic-cerved-group]
    rationale: The commercial-information notice identifies Cerved Group S.p.A., tax number 08587760961, matching the named directory member. Cerved Rating Agency and other separately listed group entities remain separate; this is not group-wide deletion.
  - guide_id: eyeota
    records: [live:eyeota-pte-ltd]
    rationale: Current marketplace policy explicitly identifies Eyeota Pte Ltd, Singapore company 201223893Z, matching the registry entity. Browser and email identifiers remain separate and other D&B databases are not included.
  - guide_id: zeta-global
    records: [live:zeta-global-corp, community:zetaglobal-com]
    rationale: The current global services DPA identifies Zeta Global Corp. and expressly makes it controller of its own Zeta Data. This supports the named inventory entity without merging customer-controlled data, separate affiliate notices or all contract entities.
  - guide_id: black-tiger-belgium
    records: [community:bisnode-be]
    rationale: Despite its legacy slug, the discovery record explicitly names Black Tiger Belgium SA/NV, the current notice's Belgian controller. Association preserves unresolved legacy Bisnode dataset scope and identifiers; it does not claim that historic marketing records were deleted or that the route is automated.
  - guide_id: predactiv-sharethis
    records: [community:sharethis]
    rationale: The current ShareThis policy identifies the brand as a Predactiv division and retains ShareThis Inc. contact details. The guide expressly covers ShareThis Data Solutions with separate email and cookie choices.
  - guide_id: abis-de
    records: [community:abis]
    rationale: Current official rights page and imprint identify the same ABIS GmbH at Lyoner Strasse 20. Parent Post Adress and other postal-marketing entities are not merged.
  - guide_id: deutsche-post-direkt
    records: ['community:deutsche-post-direkt']
    rationale: Both records explicitly name Deutsche Post Direkt GmbH and the privacy email. The guide's suppression-versus-deletion distinction remains; this is not a mapping to all DHL/Post services.
  - guide_id: dun-bradstreet-regional
    records: ['community:dud-de', 'community:dnb-at']
    rationale: German and Austrian discoveries name the exact entities documented in separate DE and AT routes. Austrian identity-document requirements differ from Germany; the association does not make countries, fields or deletion eligibility equivalent.
  - guide_id: registry-lusha-systems-inc
    records: ['community:lusha']
    rationale: Lusha Systems Inc. is explicitly one of the joint Contacts/Visitors controllers in the current notice. The legacy community form is not promoted over the current reviewed removal route.
  - guide_id: applovin-advertising
    records: ['community:applovin']
    rationale: Community AppLovin Corporation matches the current official advertising controller; device and email/phone workflows remain separate.
  - guide_id: audigent
