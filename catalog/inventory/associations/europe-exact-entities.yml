    rationale: Predictive Pop Inc. is explicitly the Audigent operating entity in the reviewed platform policy; punctuation is the only legal-name difference.
  - guide_id: clearview-ai
    records: ['community:clearview-ai']
    rationale: Clearview AI Inc. matches the official entity. Its unresolved European route and sensitive verification blocker remain in force.
  - guide_id: registry-id5-technology-ltd
    records: ['community:id5']
