    records: [community:dastelefonbuch]
    rationale: Das Telefonbuch's own current help and privacy notice name DTM and link the private-entry removal service, including proof and telephone-provider alternatives.
  - guide_id: burda-direkt-marketing
    records: [community:burda-direct-services]
    rationale: The currently embedded September 2026 policy explicitly identifies Burda Direkt Services GmbH and its matching rights inbox; the separately named technical provider is not treated as a rename.
