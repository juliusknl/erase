# These remain priorities even where automation needs more identifiers/research.
# Inclusion expresses potential exposure from the data type, not misconduct.
priority_frontiers:
  - area: Observed email-route failures
    examples: [Goava, MyGimi, HealthLink Dimensions]
    reason: Goava and MyGimi rejected delivery; HealthLink requires requests from each matching mailbox rather than a dedicated request inbox.
    remaining: Verify replacement destinations or support sender-address-specific manual requests. These are excluded from automatic pilot email coverage, not claimed fixed.
  - area: Home addresses and public lookup
    examples: [Acxiom, Whitepages, Spokeo, LexisNexis]
    reason: Linking a named person to contact and household details can facilitate unwanted contact and identification.
    remaining: Confirm personal relevance and product scope; country-specific and public-listing routes must be distinguished.
  - area: Location and device histories
    examples: [Azira, Veraset, Foursquare, Reveal Mobile, Venntel]
    reason: Device-associated movement can reveal sensitive routines even without a name or email address.
    remaining: Review actual regional collection and required advertising identifiers; generic name-and-email requests cannot cover these datasets.
  - area: Identity links and advertising audiences
    examples: [LiveRamp, Epsilon, Quantcast, PubMatic, Zeotap Data]
    reason: Linking identifiers across datasets can extend profiling and the reach of personal information.
    remaining: Distinguish device-specific suppression, historical deletion and independent customer data.
  - area: Professional contacts and enrichment
    examples: [Apollo, ZoomInfo, Cognism, Lusha, People Data Labs, RocketReach]
    reason: Searchable work identities, phone numbers and email addresses can facilitate targeting and unwanted outreach.
    remaining: Broaden field-specific workflows and record actual matching and completion outcomes.
