  - id: costar-professional-property
    name: CoStar property-contact request
    description: Request removal of matched CoStar professional/property-contact data.
    url: https://privacy.costar.com/
    source: https://www.costar.com/en-gb/gbr/about/privacy-notice
    checked_at: '2026-10-01'
    domains: [costar.com]
    scope: CoStar product records only, not every group brand or independent recipient; avoid closing a service account unintentionally.
    fields: [email, full_name, residence, brand, request_type, postal_address, phone]
    requirements_complete: false
    regions: [EEA, United Kingdom, United States, Canada, Australia, New Zealand]
    steps:
      - Verify your matching email first, then select your actual residence, the CoStar brand and one request type.
      - Review the requested address and phone matching details personally. Public instructions describe these fields; conditional runtime behavior was not tested after a direct HTTP 403.
      - Submit separate requests for other brands or request types where needed; this checklist covers only CoStar professional/property-contact records.
      - Keep confirmation and complete further verification before marking your own task complete. No broker deletion is inferred from checking this off.
    verification: Public portal instructions inspected through web retrieval; actual email verification, field conditions and submission untested.
