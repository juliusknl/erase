  - id: sovrn-advertising
    name: Sovrn device privacy choices
    description: Request deletion of matched reader data or set device-specific advertising preferences.
    url: https://www.sovrn.com/privacy-policy/policy-center/
    source: https://www.sovrn.com/privacy-policy/policy-center/
    checked_at: '2026-10-01'
    domains: [sovrn.com]
    scope: Matched Sovrn controller data only; publisher-controlled records and Commerce browser preferences are separate.
    fields: [matching_browser_or_device_identifier, requested_right]
    requirements_complete: false
    regions: [EEA, United Kingdom, Switzerland, United States]
    steps:
      - Open the Privacy Center and choose Submit a data rights request for deletion, or the separate Opt-Out Rights link for advertising suppression.
      - Use the relevant browser and provide only the identifiers needed for your request. Complete any verification yourself.
      - Commerce tracking has a separate opt-out cookie; clearing cookies or changing browser requires another opt-out.
      - Keep the result and distinguish deletion from suppression or a referral to the publisher that controls the records.
    verification: Portal fields and later identity verification untested after HTTP 403. Public policy documents the links and device-specific scope.
