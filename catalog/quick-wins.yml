items:
  - id: caci-uk
    guide_id: caci-uk
    email_draft: |
      Hello CACI Compliance Team,

      Please stop processing my personal data for direct marketing and add my matching record to your suppression list so it is not reintroduced.

      Name: [your full name]
      Matching postal address: [the address associated with your record, if you choose to share it]

      Please confirm the scope and tell me if any further matching information is necessary. Please do not remove the suppression record that prevents further marketing.
  - id: numberly-personal-request
    guide_id: numberly
    email_draft: |
      Hello Numberly Privacy Team,

      I request deletion and objection to direct-marketing use of my matched Numberly-controlled personal data.

      Relevant campaign or identifier: [describe the Numberly-related record you want checked]

      Before I send identity documents, please explain the minimum verification necessary and a secure way to complete it. If another company controls the data, please identify the appropriate contact.
  - id: weborama-identifiers
    guide_id: weborama
    email_draft: |
      Hello Weborama Privacy Team,

      Please delete the records associated with the following Weborama advertising identifiers and stop using them for advertising profiling.

      Identifiers from your official cookie-info pages: [paste the relevant identifiers here]

      Please confirm which identifiers were checked, what was removed and whether anything is retained. This request concerns my own browser data.
  - id: zeotap-data-identifiers
    guide_id: zeotap-data
    email_draft: |
      Hello Roqad Privacy Team,

      I request deletion of my Zeotap Data records and withdraw consent to advertising processing associated with the following identifiers.

      My relevant advertising or cookie identifiers: [paste identifiers you choose to provide]

      Please confirm the scope of the result and explain any additional verification needed. This request concerns Zeotap Data, not the separate Zeotap software service.
