    name: Datonics email and device choices
    description: Request deletion or opt-out separately for the identifiers you use.
    url: https://www.datonics.com/privacy/privacy-choices
    source: https://www.datonics.com/privacy/privacy-choices
    checked_at: '2026-10-01'
    domains: [datonics.com]
    scope: Covers only the supplied email, mobile advertising ID or browser. Other identifiers and independent suppliers are separate.
    fields: [email, residence, request_type, personal_accuracy_declaration]
    requirements_complete: false
    regions: [EEA, UK, Switzerland, US, Other jurisdictions]
    steps:
      - Choose the relevant email, browser or mobile-data section; use each browser where you want its cookies covered.
      - Provide email, actual residence and request type. Choose Other for an unlisted country; mobile ID is optional for non-device requests.
      - Review the personal accuracy declaration yourself. Do not assert agent authority, enable tracking or install an unfamiliar identifier app.
      - Complete any verification and record the actual outcome. Resetting an identifier can require a new opt-out.
    verification: The form may collect browser context and the team follows up. Later verification has not been tested.
