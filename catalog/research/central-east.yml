        checked_on: '2026-09-29'
        excerpt: Select the bank you will use for authentication.
        supports: [required_information, removal]
      - url: https://www.dvi.gov.lv/lv/kreditinformacijas-biroju-saraksts
        checked_on: '2026-09-29'
        excerpt: Compass UK Bidco Limited
        supports: [identity]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Exact identifiers for non-portal requests., Authenticated workflow and electronic signature not tested., Ultimate ownership and comparable personal-record count.]
