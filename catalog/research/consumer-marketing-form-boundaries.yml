        - Review regional eligibility and complete verification personally; retain the result and its actual scope.
    required_information:
      fields: [residence, relationship_context, email, requested_right]
      certainty: not_fully_specified
      verification: Public configuration inspected; conditional state handling, technical matching and subsequent verification untested.
    coverage:
      effect: deletion_request
      includes: Matched Cybba-held records within the applicable request scope.
      excludes: Automatic customer-wide deletion and historical erasure through cookie settings alone.
    automation:
