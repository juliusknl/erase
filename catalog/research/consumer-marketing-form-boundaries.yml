schema_version: 1
brokers:
  - id: belardiwong-regional-request
    name: Belardi Wong regional privacy request
    match_domains: [belardiwong.com]
    identity:
      legal_name: Belardi Wong ALC, LLC
      brands: [Belardi Wong, Belardi Ostroy]
      parent: null
      official_domains: [belardiwong.com]
    relevance:
      regions: [European Union, United Kingdom, Canada, Australia, Listed United States jurisdictions]
      category: consumer_marketing
      data_categories: [Contact details, Purchase information, Marketing inferences, Browsing activity]
      note: Non-US website rights and US service-data rights have different stated scope.
    removal:
      method: form
      destination: https://privacyportal.onetrust.com/webform/3d2d5e0c-bd98-46b8-906c-ede68a6f6a80/b727ebf0-c3dd-4f4c-bdba-e91689d7de43
      alternatives: [https://belardiwong.com/privacy-policy/, privacy.officer@belardiwong.com]
      steps:
        - Use this policy-linked non-US form with your real country, relationship and requested right; inspect the available choices personally.
        - Required fields include name, email, phone and postal address including city, region and postal code; Address Line 2 is optional.
        - Ask explicitly whether the result covers marketing-service records or only website data; do not assume website deletion clears all brokered lists.
        - US state requests and authorized agents have separate policy links. Complete verification and retain the exact scope of the response.
    required_information:
      fields: [full_name, email, phone, postal_address, country, relationship_context, requested_right]
      certainty: not_fully_specified
      verification: Public non-US form configuration inspected without submission; runtime choices and verification untested.
    coverage:
      effect: deletion_request
      includes: Matched records within the accepted regional request scope.
      excludes: Unconfirmed all-service coverage, independent customers and separate affiliates.
    automation:
      mode: manual
      reason: Regional scope, required phone/postal disclosure and identity verification require review.
    evidence:
      - url: https://belardiwong.com/privacy-policy/
        checked_on: '2026-10-01'
        published: January 27, 2026
        excerpt: Belardi Wong ALC, LLC Privacy Office
        supports: [current_entity, regional_form_delegation, website_versus_service_scope]
      - url: https://privacyportal.onetrust.com/webform/3d2d5e0c-bd98-46b8-906c-ede68a6f6a80/b727ebf0-c3dd-4f4c-bdba-e91689d7de43
        checked_on: '2026-10-01'
        excerpt: Post Town/State/Region/Province
        supports: [required_matching_fields, optional_address_line_2]
      - url: https://www.prnewswire.com/news-releases/belardiostroy-announces-expanded-services-leadership-and-name-change-300536812.html
        checked_on: '2026-10-01'
        published: October 17, 2017
        excerpt: Belardi/Ostroy will change its name to Belardi Wong
        supports: [company_issued_brand_rename_not_extra_database]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Runtime and service-record fulfilment untested., Policy readable through web retrieval while direct HTTP returned 403., Parent and comparable scale unreviewed.]
  - id: crosspixel-browser-preferences
    name: Cross Pixel advertising preferences
    match_domains: [crosspixel.net]
    identity:
      legal_name: Cross Pixel Media, Inc.
      brands: [Cross Pixel]
      parent: Knower Tech USA
      official_domains: [crosspixel.net, crsspxl.com]
    relevance:
      regions: [United States rights, Browser preference — other regional handling untested]
      category: advertising
      data_categories: [Cookie and mobile IDs, Browsing interests, Approximate location]
      note: The notice says it does not collect names or plaintext emails for this service; a new email cannot match a cookie profile.
    removal:
      method: form
      destination: https://privacy.crsspxl.com/
      alternatives: [privacy@crosspixel.net]
      steps:
        - Use the portal in your actual browser and review its Opt Out action yourself. No preference-changing endpoint was executed during research.
        - Repeat for other browsers and devices; the portal describes behavioral-targeting and sale suppression, not historical erasure.
        - For deletion or access, email the privacy team and clarify matching cookie/device identifiers and applicable regional rights first.
        - Independent publishers and partners have separate data and controls. Save the actual outcome.
    required_information:
      fields: [actual_browser_context]
      certainty: not_fully_specified
      verification: Portal instructions inspected; action controls, preference persistence and deletion matching untested.
    coverage:
      effect: suppression
      includes: Cross Pixel targeting and sale preference for the acted-on browser context.
      excludes: Historical erasure, other devices and independent partner data.
    automation:
      mode: manual
      reason: A server-side preference action would use the wrong browser identity; historical requests need technical matching.
    evidence:
      - url: https://crosspixel.net/privacy-policy/
        checked_on: '2026-10-01'
        published: December 8, 2025
        excerpt: a subsidiary of Knower Tech USA
        supports: [entity_and_parent, device_data_scope, rights_email_and_US_scope]
      - url: https://privacy.crsspxl.com/
        checked_on: '2026-10-01'
        excerpt: opt out of behavioral targeting
        supports: [suppression_portal_not_historical_deletion]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Runtime controls and fulfilment untested., Non-US rights matching and comparable scale unreviewed.]
  - id: dataline-consumer-marketing
    name: Dataline marketing suppression
    match_domains: [datalinedata.com]
    identity:
      legal_name: Dataline, Inc.
      brands: [Dataline]
      parent: null
      official_domains: [datalinedata.com]
    relevance:
      regions: [United States, Other residence — clarify route]
      category: consumer_marketing
      data_categories: [Contact details, Marketing attributes, Household profiles]
      note: The published form treats deletion requests as do-not-sell requests, not historical erasure.
    removal:
      method: form
      destination: https://datalinedata.com/do-not-sell-my-information/
      alternatives: [privacy.officer@datalinedata.com]
      steps:
        - Review the suppression terms before selecting an action. The form labels legal name, email and address required and offers US state selections.
        - If you want actual historical deletion rather than suppression, the form tells you to notify privacy.officer@datalinedata.com explicitly.
        - Do not invent a US address. Ask for an appropriate route if your residence does not fit; access requests require email verification.
        - Record the actual confirmed outcome, not the label on the button.
    required_information:
      fields: [full_name, email, postal_address, requested_right]
      certainty: not_fully_specified
      verification: Published required labels inspected; runtime and non-US eligibility untested.
    coverage:
      effect: suppression
      includes: Dataline's stated do-not-sell suppression process.
      excludes: Historical erasure unless separately confirmed, other controllers and all-browser preferences.
    automation:
      mode: manual
      reason: Postal disclosure and the deletion-versus-suppression mismatch need personal review.
    evidence:
      - url: https://datalinedata.com/privacy-policy/
        checked_on: '2026-10-01'
        excerpt: privacy.officer@datalinedata.com
        supports: [controller_and_marketing_scope, rights_contact]
      - url: https://datalinedata.com/do-not-sell-my-information/
        checked_on: '2026-10-01'
        published: July 1, 2026
        excerpt: we interpret these requests all as “do not sell requests”
        supports: [suppression_not_erasure, required_labels, explicit_email_clarification]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Form fulfilment and non-US handling untested., Parent and comparable scale unreviewed.]
  - id: dataman-consumer-marketing
    name: Dataman Group privacy request
    match_domains: [datamangroup.com]
    identity:
      legal_name: Dataman Group Inc.
      brands: [Dataman Group, Dataman Group Direct]
      parent: null
      official_domains: [datamangroup.com]
    relevance:
      regions: [United States — applicable state rights, Other residence — clarify eligibility]
      category: consumer_marketing
      data_categories: [Mailing addresses, Consumer and business marketing lists]
      note: Matching postal records needs more than a new dedicated request email.
    removal:
      method: form
      destination: https://www.datamangroup.com/privacy-request-form/
      alternatives: [privacy@datamangroup.com]
      steps:
        - Enter name and required street, city, state and postal code. Email and additional information are optional in the inspected form.
        - State the desired deletion or suppression request in Additional Information; review the accuracy confirmation and human-verification question yourself.
        - The rights page also accepts email. Clarify non-US eligibility and matching instead of assuming the state-focused form grants universal coverage.
        - Complete any verification and retain the response; acknowledgment only confirms receipt.
    required_information:
      fields: [full_name, postal_address, requested_right, human_confirmation]
      certainty: not_fully_specified
      verification: Public form fields inspected; later identity checks and regional handling untested.
    coverage:
      effect: deletion_request
      includes: Matched Dataman marketing records under the applicable request.
      excludes: Independent customer copies and unverified universal regional coverage.
    automation:
      mode: manual
      reason: Postal matching, personal confirmation and regional eligibility need review.
    evidence:
      - url: https://www.datamangroup.com/consumer-privacy-rights/
        checked_on: '2026-10-01'
        published: July 2026
        excerpt: prefer to submit your request by email
        supports: [state_rights_scope, email_alternative, identity_checks]
      - url: https://www.datamangroup.com/privacy-request-form/
        checked_on: '2026-10-01'
        excerpt: I certify that the information I have provided is accurate
        supports: [required_postal_matching, optional_email, personal_confirmation]
      - url: https://www.datamangroup.com/privacy/
        checked_on: '2026-10-01'
        excerpt: Dataman Group Inc.
        supports: [entity_and_marketing_list_scope]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Fulfilment and non-US handling untested., Parent and comparable scale unreviewed.]
  - id: agr-consumer-marketing
    name: AGR consumer-data opt-out
    match_domains: [agrmarketingsolutions.com]
    identity:
      legal_name: AGR Marketing Solutions, LLC
      brands: [AGR Marketing Solutions]
      parent: null
      official_domains: [agrmarketingsolutions.com]
    relevance:
      regions: [United States — applicable state rights, Other residence — clarify eligibility]
      category: consumer_marketing
      data_categories: [Consumer profiles, Interests, Demographics, Contact details]
      note: Third-party consumer records are covered even without a prior website visit.
    removal:
      method: form
      destination: https://agrmarketingsolutions.com/privacy-policy/
      alternatives: [contact@agrmarketingsolutions.com]
      steps:
        - For the embedded OPT-OUT form, review required name, email, phone and full postal address before disclosing them.
        - Additional emails and phone numbers are optional. Complete verification personally.
        - The policy accepts access, deletion and opt-out requests by email; explicitly specify deletion if that is the intended outcome.
        - Published rights focus on US states. Clarify other residence and matching requirements rather than assuming an email-only European workflow.
    required_information:
      fields: [full_name, email, phone, postal_address]
      certainty: not_fully_specified
      verification: Embedded form's required fields inspected; email matching checklist and non-US eligibility unspecified.
    coverage:
      effect: suppression
      includes: AGR consumer-data opt-out; historical deletion must be separately requested and confirmed.
      excludes: Guaranteed erasure from an opt-out acknowledgment and independent client records.
    automation:
      mode: manual
      reason: Phone/postal disclosure, regional scope and distinct requested rights need review.
    evidence:
      - url: https://agrmarketingsolutions.com/privacy-policy/
        checked_on: '2026-10-01'
        excerpt: Submit OPT-OUT Request
        supports: [entity, consumer_aggregator_scope, form_fields, email_rights_route, US_state_scope]
    scale: null
    review_status: instructions_reviewed
