        checked_on: '2026-10-01'
        excerpt: Cybba Inc.
        supports: [entity, service_and_website_scope]
      - url: https://cybba.com/privacy-choices/
        checked_on: '2026-10-01'
        excerpt: privacy rights request form
        supports: [distinct_rights_and_optout_forms, cookie_scope]
      - url: https://cybba-requests.my.onetrust.com/webform/a4a1351e-d293-4305-bde4-b9cf8f5c0989/81d37a05-cc75-4c12-924c-56c5c45bf269
        checked_on: '2026-10-01'
        excerpt: Anything else that would help us find your information?
        supports: [required_fields, optional_brand_context, optional_names]
