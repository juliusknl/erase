  - id: datasys-consumer-records
    name: Datasys consumer-data request
    match_domains: [datasys.com]
    identity:
      legal_name: Datasys Group, Inc.
      brands: [Datasys]
      parent: null
      official_domains: [datasys.com]
    relevance:
      regions: [United States, GDPR rights referenced — regional matching requires review]
      category: consumer_marketing
      data_categories: [Consumer marketing data, Contact identifiers, Advertising audiences]
      note: The preferred portal separates deletion, access and opt-out.
    removal:
      method: form
      destination: https://privacy.datasys.com/request
      alternatives: [https://datasys.com/privacy/my-privacy-choices, privacy@datasys.com]
      steps:
        - Choose Delete My Data for erasure; Opt-Out is the separate do-not-sell/share request.
        - The first of four steps is publicly visible. Inspect the remaining matching fields, regional choices and verification yourself before submitting.
        - The policy provides an email fallback if the portal cannot be used, with subject [Your State] Privacy Request. For non-US residence, clarify the appropriate process without inventing a state.
        - Retain the verified result; suppression retains a do-not-share record and is not the same as historical deletion.
    required_information:
      fields: [requested_right, identity_information_as_requested, residence]
      certainty: not_fully_specified
      verification: Only the initial action-selection step inspected; subsequent fields and verification untested.
    coverage:
      effect: deletion_request
      includes: Verified Datasys-held personal records subject to stated exceptions.
      excludes: Guaranteed regional eligibility, independent customer copies and deletion from an opt-out alone.
    automation:
      mode: manual
      reason: Preferred staged portal and undisclosed downstream identity requirements prevent generic email automation.
    evidence:
      - url: https://datasys.com/privacy-policy
        checked_on: '2026-10-01'
        published: April 9, 2026
        excerpt: Datasys Group, Inc.
        supports: [entity, rights_scope, portal_preference, fallback_email]
      - url: https://datasys.com/privacy/my-privacy-choices
        checked_on: '2026-10-01'
        excerpt: You may choose to exercise both rights
        supports: [deletion_distinct_from_optout, portal_delegation]
      - url: https://privacy.datasys.com/request
        checked_on: '2026-10-01'
        excerpt: Step 1 of 4
        supports: [public_initial_actions, later_fields_uninspected]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Portal matching and fulfilment untested., Policy's legal assertions not independently endorsed., Parent and comparable scale unreviewed.]
  - id: datafy-device-location
    name: Datafy device-data request
    match_domains: [datafy.com]
    identity:
      legal_name: Datafy, LLC
      brands: [Datafy]
      parent: null
      official_domains: [datafy.com]
    relevance:
      regions: [United States, GDPR rights referenced — country-specific handling untested]
      category: advertising
      data_categories: [Mobile advertising identifiers, Analytics and advertising data, Device-related records]
      note: A mobile advertising ID, not a new email address, is central to matching device records.
    removal:
      method: form
      destination: https://www.datafy.com/opt-out
      alternatives: [opt-out@datafy.com, privacy@datafy.com]
      steps:
        - Choose yourself, your actual country/state and deletion; provide name and reply email and review the signature personally.
        - The MAID label says optional, but the HTML input is required and instructions say it is needed for matching. Clarify this with the privacy team if you lack the ID; never fabricate one.
        - Do not install an unfamiliar ID-retrieval app merely because the page suggests it. Verify any device instructions before acting.
        - Retain the request ID for the status page and complete subsequent verification. A submitted form is not proof of deletion.
    required_information:
      fields: [full_name, email, residence, mobile_advertising_id, requested_right, personal_signature]
      certainty: not_fully_specified
      verification: Required MAID HTML and matching instructions conflict with its optional label; signature is visually required but lacks an HTML required attribute. Runtime untested.
    coverage:
      effect: deletion_request
      includes: Datafy records matched to the verified request identifiers.
      excludes: Independent source databases, unmatched devices and guaranteed regional eligibility.
    automation:
      mode: manual
      reason: Technical identifier matching, contradictory requirements and personal signature need review.
    evidence:
      - url: https://www.datafy.com/privacy-policy
        checked_on: '2026-10-01'
        published: July 1, 2026
        excerpt: Datafy, LLC
        supports: [entity, rights_contact, third_party_source_boundary]
      - url: https://www.datafy.com/opt-out
        checked_on: '2026-10-01'
        excerpt: We require this ID in your request
        supports: [MAID_requirement_conflict, public_fields, signature_and_status_tracking]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Contradictory matching requirements and regional handling need clarification., Fulfilment untested., Parent and comparable scale unreviewed.]
  - id: civis-analytics-consumer
    name: Civis Analytics consumer-rights request
    match_domains: [civisanalytics.com]
    identity:
      legal_name: Civis Analytics, Inc.
      brands: [Civis Analytics]
      parent: null
      official_domains: [civisanalytics.com]
    relevance:
      regions: [Listed United States jurisdictions, Non-US form branch — eligibility unverified]
      category: consumer_marketing
      data_categories: [Third-party personal data, Contact information, Survey and analytics data]
      note: Rights are state-specific; a non-US form option does not establish an accepted European deletion route.
    removal:
      method: form
      destination: https://docs.google.com/forms/d/e/1FAIpQLSfvUYww9wEK9Y4F6VY3nQtm0bBS8QTdcDthet6WAKDYqnnwHA/viewform
      alternatives: [https://www.civisanalytics.com/legal-pages/supplemental-privacy-notice]
      steps:
        - Select your actual residence. The opening step offers listed US states, non-US and None of the above; do not falsely attest to US residence.
        - Later form questions and non-US routing were not exercised; inspect matching requirements and choose the intended right yourself.
        - The policy says not to submit rights requests to its questions mailbox and that unspecified channels will not be processed.
        - California consumers also have a telephone route; postal address, email, phone and name are requested there. Do not substitute those telephone requirements for unseen form fields.
    required_information:
      fields: [residence, identity_information_as_requested, requested_right]
      certainty: not_fully_specified
      verification: Only opening residence choices inspected; downstream form and non-US eligibility untested.
    coverage:
      effect: deletion_request
      includes: Matched Civis records under an accepted applicable rights request.
      excludes: Guaranteed European coverage, independent clients and unsupported email delivery.
    automation:
      mode: manual
      reason: State eligibility and staged form verification cannot be replaced by the general questions email.
    evidence:
      - url: https://www.civisanalytics.com/legal-pages/privacy-policy
        checked_on: '2026-10-01'
        excerpt: Civis Analytics, Inc.
        supports: [entity, third_party_collection_and_service_scope]
      - url: https://www.civisanalytics.com/legal-pages/supplemental-privacy-notice
        checked_on: '2026-10-01'
        published: January 13, 2026
        excerpt: Please do not use this email address to submit a data subject request.
        supports: [specified_channels_only, regional_scope, California_phone_requirements]
      - url: https://docs.google.com/forms/d/e/1FAIpQLSfvUYww9wEK9Y4F6VY3nQtm0bBS8QTdcDthet6WAKDYqnnwHA/viewform
        checked_on: '2026-10-01'
        excerpt: I am a non-U.S. resident.
        supports: [initial_residence_choices_not_proven_eligibility]
    scale: null
    review_status: instructions_reviewed
    tested_outcome: not_tested
    unknowns: [Downstream form, non-US handling and fulfilment untested., Parent and comparable scale unreviewed.]
  - id: cybba-marketing-services
