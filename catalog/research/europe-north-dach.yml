  - id: "moneyhouse-ch"
    name: "Moneyhouse"
    match_domains: ["moneyhouse.ch"]
    identity: {"legal_name":"Neue Zürcher Zeitung AG (Moneyhouse; CHE-106.838.812)","brands":["Moneyhouse"],"parent":null,"official_domains":["moneyhouse.ch"]}
    relevance: {"regions":["CH"],"category":"credit_reference","data_categories":["Business relationships","Company and person records","Credit information"],"note":"Separate records may come from public registers or other credit providers."}
    removal:
      method: manual
      destination: https://www.moneyhouse.ch/de/privacy
      alternatives: [contact@moneyhouse.ch]
      steps:
        - Identify whether you want private-listing removal, access to records, or account marketing preferences. Do not buy a credit report or close an account merely to request privacy rights.
        - Request removal of private data not in the commercial register at contact@moneyhouse.ch. Moneyhouse requires its own request even after removal elsewhere.
        - For self-access, the published procedure requires an official ID copy and returns the report by post. Personally review document disclosure; ask for a secure channel or use Moneyhouse, Neue Zürcher Zeitung AG, Falkenstrasse 11, CH-8008 Zürich. Never attach identity documents automatically.
        - Review the returned records and any retention explanation. Credit and payment data sourced from CRIF require a separate CRIF request; do not treat this as global NZZ or public-register deletion.
    required_information: {"fields":["identity_document"],"certainty":"not_fully_specified","verification":"The main-platform notice requires an official ID copy for self-access, with a postal response; it does not publish a separate complete private-listing deletion checklist. Review matching and document disclosure personally."}
    coverage: {"effect":"access_then_review","includes":"Moneyhouse self-access and specifically requested removal of private data absent from the commercial register.","excludes":"Commercial-register entries, CRIF's separate credit/payment database, unrelated NZZ services and automatic account closure."}
    automation: {"mode":"manual","reason":"Separate private-listing removal from credit access and personally review any ID disclosure; no generic automatic credit-deletion email."}
    evidence:
      - url: https://www.moneyhouse.ch/de/privacy
        checked_on: '2026-10-01'
        published: '2021-08-01'
        excerpt: contact@moneyhouse.ch
        supports: [removal, required_information, independent_database, private_listing_scope, crif_boundary]
