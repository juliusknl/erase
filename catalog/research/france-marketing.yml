    required_information:
      fields: []
      certainty: not_fully_specified
      verification: Campaign matching and verification not established. Sales-form company, role and telephone fields are not a deletion checklist.
    coverage:
      effect: needs_review
      includes: Documented data-marketing relevance and website rights contacts.
      excludes: Verified removal from supplied third-party datasets or all source collectors.
    automation:
      mode: blocked
      reason: Product-data controller, request route and matching requirements remain unresolved.
    evidence:
      - url: https://dataondemand.fr/web/mentionslegales/
        checked_on: '2026-09-29'
        excerpt: 'Immatriculation : n° 791 086 028 au RCS de Paris'
