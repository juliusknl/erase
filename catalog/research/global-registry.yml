  - id: 4eyes-delivr-review
    name: 4Eyes / Delivr.ai — controller review
    match_domains: [4-eyes.ai]
    identity:
      legal_name: 4Eyes.ai Inc. (registry); current Delivr.ai legal-controller relationship unresolved
      brands: [4Eyes.ai, Delivr.ai]
      parent: null
      official_domains: [4-eyes.ai, delivr.ai]
    relevance:
      regions: [US, EEA_scope_unconfirmed]
      category: advertising
      data_categories: [identity_graph, browser_activity, contact_identifiers, device_identifiers]
      note: The registered 4Eyes request link displays Delivr.ai, while Delivr's current notice uses a different request platform. Do not assume the legacy portal covers current products.
    removal:
      method: investigate
      destination: https://www.delivr.ai/privacy
      alternatives: [info@delivr.ai]
      steps:
        - Start from Delivr.ai's current privacy notice and its Submit a Request control.
        - Confirm which controller holds the legacy 4Eyes data before supplying additional identifiers.
        - Request erasure and sale/sharing opt-out as appropriate; retain the response rather than treating a portal submission as completion.
    required_information:
      fields: []
      certainty: not_fully_specified
      verification: Legacy PieEye form displays requester/action, username, first/last name, email, phone, comments and accuracy confirmation, but HTML does not establish required fields. Current notice instead identifies Concord as its request platform.
    coverage:
      effect: needs_review
      includes: Current notice describes Delivr site/pixel identity processing and rights requests.
      excludes: Legacy 4Eyes product data, other controllers and full corporate continuity are not established by a redirect or branded form.
    automation:
      mode: blocked
      reason: Conflicting legacy/current forms and unverified controller continuity require resolution before sending.
    evidence:
      - url: https://www.delivr.ai/privacy
        checked_on: 2026-09-28
        published: August 30, 2026
        excerpt: Concord (strictly necessary) Records your cookie preferences and powers our data subject request form.
        supports: [current_request_platform, data_categories, rights, scope]
