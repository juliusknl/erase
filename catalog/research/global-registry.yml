    coverage:
      effect: deletion_request
      includes: Business Database removal; customers receive opt-out notifications and historical exports redact removed contacts.
      excludes: Customer copies with an independent lawful basis, processor data and retention exceptions are not blanket-deleted.
    automation:
      mode: manual
      reason: Current form fields remain inaccessible; no current unobscured privacy mailbox was independently confirmed for automated use.
    evidence:
      - url: https://6sense.com/privacy-policy/
        checked_on: 2026-09-28
        published: August 24, 2026
