    match_domains: ["adagio.io"]
    identity: {"legal_name":"Onfocus SAS","brands":["Adagio"],"parent":null,"official_domains":["adagio.io"]}
    relevance: {"regions":["EEA","United Kingdom","United States","Worldwide opt-out"],"category":"advertising","data_categories":["Device identifiers","Advertising profiles","Interaction data"],"note":"Adagio is Onfocus's advertising brand; policy offers opt-out regardless of location."}
    removal:
      method: form
      destination: https://adagio.io/legal/privacy-center
      alternatives: [privacy@adagio.io]
      steps:
        - Use the original browser with its existing Adagio cookie for the opt-out control. If no identifier is detected, ask the privacy inbox for help; do not enable tracking merely to create one.
        - Keep the 400-day preference cookie and repeat for other browsers or after clearing cookies.
