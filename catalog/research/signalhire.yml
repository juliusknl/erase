      fields: [work_email, profile_url]
      certainty: not_fully_specified
      verification: Public form labels business email mandatory and requests the profile URL; the FAQ permits business-email verification. Later checks remain untested.
    coverage:
      effect: deletion_request
      includes: Removal of matching Prospects Database and Professional Profile information, with suppression/retention exceptions.
      excludes: Original public websites and independently held customer copies; not automatic account closure.
    automation: {mode: manual, reason: A profile URL and personal email verification are needed for the guided flow; the current sender does not carry broker-specific profile URLs.}
    evidence:
      - url: https://www.signalhire.com/opt-out
        checked_on: '2026-09-30'
        excerpt: Enter your business email (mandatory)
        supports: [form, matching_fields, suppression]
      - url: https://www.signalhire.com/privacy
