{% if not item.done %}
<div class="action-options">
  {% if item.preference %}<form method="post" action="/recommendations/{{ item.id }}/restore"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-button">Show again</button></form>
  {% else %}
  <form method="post" action="/recommendations/{{ item.id }}/later"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="return_to" value="{{ action_return | default('/quick-wins') }}"><button class="text-button">Later</button></form>
  <form method="post" action="/recommendations/{{ item.id }}/skip"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="return_to" value="{{ action_return | default('/quick-wins') }}"><button class="text-button">Not interested</button></form>
  {% endif %}
</div>
{% endif %}
